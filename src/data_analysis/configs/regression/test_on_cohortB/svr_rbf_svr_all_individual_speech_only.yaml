config_data:
  dataset: LUHACombined
  task: all_individual
  transcript_version: google
  split: full
config_audio_features:
  feature_version: reduced
config_linguistic_features:
  feature_version: reduced
config_model:
  model_name: SVR
  cv_splits: 1
  target_variable: [composite_language, composite_memory, composite_speed, composite_executive_function]
  svr_parameters:
    gamma: 0.001
    epsilon: 0.321471781635738
    C: 3.359818286283781
  #calculate_shap: True  # calculate SHAP values, tasks long for SVR
debug: false
model: Regression
data_transformers:
- Linguistic Features
- Audio Features
- Task Features
data_preprocessors:
- Outlier Removal and Imputation
- Feature Standardizer
